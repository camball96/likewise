name: Ingest catalogue into Postgres

on:
  schedule:
    - cron: "47 16 * * *"   # daily, ~2:47am Brisbane
  workflow_dispatch:         # the app calls this with references_only=true when someone pastes a link
    inputs:
      references_only:
        description: "Only fingerprint pasted style references"
        type: boolean
        default: false

concurrency:
  group: ingest-${{ inputs.references_only || 'false' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements.txt

      # keep the downloaded image model between runs so quick reference runs start fast
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-marqo-fashionsiglip

      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/ingest.py ${{ inputs.references_only && '--references-only' || '' }}
